name: PRACTICA2POM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Datos comunes que se mandan a OpenObserve en cada evento del pipeline
env:
  O2_URL: ${{ secrets.O2_URL }}
  O2_AUTH: ${{ secrets.O2_AUTH }}
  RAMA: ${{ github.head_ref || github.ref_name }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # ------------------------------------------------------------------
  # 1. Pruebas unitarias del backend (JUnit + JaCoCo >= 70 %)
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas y cobertura
        id: junit
        run: ./mvnw -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          awk -F, 'NR>1{m+=$8;c+=$9} END{printf "Cobertura de lineas: %.1f%%\n", c*100/(m+c)}' target/site/jacoco/jacoco.csv || true

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Registrar resultado en OpenObserve
        if: always()
        run: |
          jq -n \
            --arg evento "pruebas_unitarias" \
            --arg estado "${{ steps.junit.outcome }}" \
            --arg commit "$GITHUB_SHA" \
            --arg rama "$RAMA" \
            --arg usuario "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            '[{evento:$evento, estado:$estado, commit:$commit, rama:$rama, usuario:$usuario, run_url:$run_url}]' > evento.json
          cat evento.json
          curl -sS -f -X POST "$O2_URL/api/default/cicd/_json" \
            -H "Authorization: Basic $O2_AUTH" -H "Content-Type: application/json" \
            -d @evento.json || echo "::warning::No se pudo enviar el evento a OpenObserve"

  # ------------------------------------------------------------------
  # 2. Pruebas E2E con Playwright (backend + frontend en contenedores)
  # ------------------------------------------------------------------
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imágenes
        run: |
          docker build -t practica2pom:ci .
          docker build -t practica2-frontend:ci ./frontend

      - name: Levantar backend y frontend
        run: |
          docker network create obs
          docker run -d --name practica2pom --network obs \
            -e OTEL_JAVAAGENT_ENABLED=false \
            practica2pom:ci
          docker run -d --name practica2-frontend --network obs -p 8081:80 \
            practica2-frontend:ci

      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/health; then echo; echo "App lista"; exit 0; fi
            sleep 2
          done
          echo "La app no arrancó a tiempo"
          docker logs practica2pom
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Ejecutar pruebas Playwright
        id: playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
        run: npx playwright test

      - name: Logs del backend (si algo falló)
        if: failure()
        run: docker logs practica2pom | tail -100

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

      - name: Registrar resultado en OpenObserve
        if: always()
        run: |
          STATS=$(jq -c '.stats' e2e/results.json 2>/dev/null || echo '{}')
          jq -n \
            --arg evento "pruebas_e2e" \
            --arg estado "${{ steps.playwright.outcome }}" \
            --arg commit "$GITHUB_SHA" \
            --arg rama "$RAMA" \
            --arg usuario "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            --argjson stats "$STATS" \
            '[{evento:$evento, estado:$estado, commit:$commit, rama:$rama, usuario:$usuario, run_url:$run_url,
               pruebas_ok:($stats.expected // 0), pruebas_fallidas:($stats.unexpected // 0),
               pruebas_flaky:($stats.flaky // 0), duracion_ms:($stats.duration // 0)}]' > evento.json
          cat evento.json
          curl -sS -f -X POST "$O2_URL/api/default/cicd/_json" \
            -H "Authorization: Basic $O2_AUTH" -H "Content-Type: application/json" \
            -d @evento.json || echo "::warning::No se pudo enviar el evento a OpenObserve"

  # ------------------------------------------------------------------
  # 3. Publicar imágenes (solo push a main y solo si TODAS las pruebas pasaron)
  # ------------------------------------------------------------------
  docker:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:${{ github.sha }}

      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2-frontend:${{ github.sha }}

  # ------------------------------------------------------------------
  # 4. Despliegue en EC2 (nunca corre si fallan las pruebas)
  # ------------------------------------------------------------------
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        id: ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker network create obs || true
            docker network connect obs openobserve || true

            # ---------- Backend (Spring Boot + agente OpenTelemetry) ----------
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest
            docker stop practica2pom || true
            docker rm practica2pom || true
            docker run -d --name practica2pom --restart unless-stopped \
              --network obs \
              -p 8080:8080 -v api-data:/data -e DB_PATH=/data/app.db \
              -e OTEL_SERVICE_NAME=practica2pom \
              -e OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default \
              -e OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
              -e "OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic%20${{ secrets.O2_AUTH }}" \
              -e OTEL_TRACES_EXPORTER=otlp \
              -e OTEL_METRICS_EXPORTER=otlp \
              -e OTEL_LOGS_EXPORTER=otlp \
              -e OTEL_METRIC_EXPORT_INTERVAL=10000 \
              -e "OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES=*" \
              ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest

            # ---------- Frontend (Angular + Nginx) ----------
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/practica2-frontend:latest
            docker stop practica2-frontend || true
            docker rm practica2-frontend || true
            docker run -d --name practica2-frontend --restart unless-stopped \
              --network obs -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/practica2-frontend:latest

            docker image prune -a -f
            docker ps

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: |
          jq -n \
            --arg evento "despliegue_ec2" \
            --arg estado "${{ steps.ssh.outcome }}" \
            --arg commit "$GITHUB_SHA" \
            --arg rama "$RAMA" \
            --arg usuario "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg servidor "${{ secrets.EC2_HOST }}" \
            '[{evento:$evento, estado:$estado, commit:$commit, rama:$rama, usuario:$usuario, run_url:$run_url, servidor:$servidor}]' > evento.json
          curl -sS -f -X POST "$O2_URL/api/default/cicd/_json" \
            -H "Authorization: Basic $O2_AUTH" -H "Content-Type: application/json" \
            -d @evento.json || echo "::warning::No se pudo enviar el evento a OpenObserve"