name: PRACTICA2POM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas y cobertura
        run: ./mvnw -B verify
      - name: Resumen de cobertura
        if: always()
        run: |
          awk -F, 'NR>1{m+=$8;c+=$9} END{printf "Cobertura de lineas: %.1f%%\n", c*100/(m+c)}' target/site/jacoco/jacoco.csv
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest
            docker stop practica2pom || true
            docker rm practica2pom || true
            docker run -d --name practica2pom --restart unless-stopped \
              -p 80:8080 -v api-data:/data -e DB_PATH=/data/app.db \
              ${{ secrets.DOCKERHUB_USERNAME }}/practica2pom:latest
            docker image prune -f