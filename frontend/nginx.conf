server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: busca "practica2pom" en cada petición,
  # así Nginx no truena si el backend todavía no arranca
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend http://practica2pom:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de Angular (/productos, /usuarios...) caen en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
