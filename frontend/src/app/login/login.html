<form class="card" (ngSubmit)="entrar()">
  <h2>Iniciar sesión prueba</h2>
  <input name="correo" type="email" placeholder="Correo" [(ngModel)]="correo" data-testid="login-correo" required>
  <input name="password" type="password" placeholder="Contraseña" [(ngModel)]="password" data-testid="login-password" required>
  <button type="submit" data-testid="login-entrar">Entrar</button>
  @if (error()) { <p class="error" data-testid="login-error">{{ error() }}</p> }
</form>
