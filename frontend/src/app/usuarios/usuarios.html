<h2>Usuarios</h2>

<form class="card fila" (ngSubmit)="guardar()">
  <input name="nombre" placeholder="Nombre" [(ngModel)]="form.nombre" data-testid="usr-nombre" required>
  <input name="correo" type="email" placeholder="Correo" [(ngModel)]="form.correo" data-testid="usr-correo" required>
  <input name="password" type="password" [(ngModel)]="form.password" data-testid="usr-password"
         [placeholder]="editandoId() ? 'Nueva contraseña (opcional)' : 'Contraseña (mín. 6)'">
  <button type="submit" data-testid="usr-guardar">{{ editandoId() ? 'Actualizar' : 'Agregar' }}</button>
  @if (editandoId()) { <button type="button" (click)="cancelar()">Cancelar</button> }
</form>

@if (error()) { <p class="error" data-testid="usr-error">{{ error() }}</p> }

<table data-testid="tabla-usuarios">
  <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th></th></tr></thead>
  <tbody>
    @for (u of usuarios(); track u.id) {
      <tr>
        <td>{{ u.id }}</td><td>{{ u.nombre }}</td><td>{{ u.correo }}</td>
        <td>
          <button (click)="editar(u)">Editar</button>
          <button (click)="eliminar(u.id)" data-testid="usr-eliminar">Eliminar</button>
        </td>
      </tr>
    }
  </tbody>
</table>
